[package]
name = "retriever"
description = "Retriever: a GNOME download manager (GTK 4 + libadwaita) on Mister Download Manager's engine"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "retriever"
path = "src/main.rs"

[dependencies]
mdm-engine.workspace = true
mdm-ipc.workspace = true
mdm-torrent.workspace = true
mdm-tools.workspace = true
mdm-extract.workspace = true
reqwest.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
dirs.workspace = true

[lints]
workspace = true
