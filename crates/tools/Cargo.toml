[package]
name = "mdm-tools"
description = "Verified, pinned installs of helper tools (yt-dlp) for Mister Download Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
bytes.workspace = true
craft-atomic.workspace = true
futures.workspace = true
hex.workspace = true
mdm-engine.workspace = true
mdm-ipc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
percent-encoding.workspace = true
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# Node.js's macOS and Linux builds (#1570).
tar = { version = "0.4.46", default-features = false }
flate2.workspace = true

[features]
# Update now's end-to-end tests only, never in a release (tools/installer and release.yml don't
# turn it on): MDM_TEST_UPDATE_KEY names a test key a fake release's checksum list may be signed
# with instead of MDM's release key.
test-update = []

[lints]
workspace = true

# A helper's process group killed whole (#1301), safely.
[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process"] }
